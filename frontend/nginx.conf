server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Docker's built-in DNS. With the address in a VARIABLE, nginx looks "backend" up on every request (cached 5 s) instead
  # of once at startup, so a recreated or restarted API container (new IP) is found again without restarting nginx.
  resolver 127.0.0.11 valid=5s;

  # The browser only talks to its own origin: /api/x -> backend /x (the same job Vite's dev proxy does).
  # With a variable, proxy_pass cannot strip the prefix itself, so the rewrite does it.
  location /api/ {
    set $backend http://backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
  }

  # Hashed build files never change under the same name, so they can be cached forever.
  # (expires, not add_header: a location with its own add_header would drop the security headers above.)
  location /assets/ {
    expires 1y;
  }

  # Single-page app: any other path is handled by the app, not a 404.
  location / {
    try_files $uri /index.html;
    expires -1; # always re-check, so a new deploy is picked up
  }
}
