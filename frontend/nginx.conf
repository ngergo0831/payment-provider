server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # The browser only talks to its own origin: /api/x -> backend /x (the same job Vite's dev proxy does).
  # The trailing slash on proxy_pass is what strips the /api prefix.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
  }

  # Hashed build files never change under the same name, so they can be cached forever.
  # (expires, not add_header: a location with its own add_header would drop the security headers above.)
  location /assets/ {
    expires 1y;
  }

  # Single-page app: any other path is handled by the app, not a 404.
  location / {
    try_files $uri /index.html;
    expires -1; # always re-check, so a new deploy is picked up
  }
}
